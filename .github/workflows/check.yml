# The pre-ship gate, on every push and pull request:
#   - generated files (tokens.json, styleguide.html, sc-theme.js, sc-charts.js) are fresh
#   - one version stream, identical light blocks, no CRLF, page CSS hygiene
#   - every sc-* class used by the guide, starter and wrappers exists in sc.css
#   - the documented contrast pairs still pass
#   - the guide names every class the sheet defines, and its cover numbers are real
#   - the consumer linter still finds exactly the mistakes planted in build/fixtures/
#   - the React wrappers build
name: check
on:
  push:
  pull_request:
  # The gate can be re-run on demand — rule 1's tag check depends on state that
  # lives OUTSIDE the commit (whether origin has the tag yet), so a run that
  # failed only for a missing tag becomes correct the moment the tag is pushed,
  # with nothing to re-commit.
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Regenerate and diff
        run: |
          node build/gen-tokens.mjs
          node build/assemble.mjs
          git diff --exit-code -- tokens.json styleguide.html sc-theme.js sc-charts.js sc-map.js
      - name: Gate
        run: node build/check.mjs
      - name: React wrappers
        run: |
          npm --prefix react ci
          npm --prefix react run build
  decision-brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Render the copyable decision brief
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          node build/visual-check.mjs --browser --shots /tmp/decision-brief-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decision-brief-proof
          path: /tmp/decision-brief-proof
          if-no-files-found: ignore
